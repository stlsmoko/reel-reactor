<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C11">
<meta name="mobile-web-app-capable" content="yes">
<title>Reel Reactor Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
</head>
<body>

<style>
  /* Committed single-theme dark: this is a camera viewfinder. Every colour is
     painted explicitly so the page holds on any host ground. */
  :root {
    --ground: #0A0C11;
    --surface: #151A23;
    --surface-2: #1E2531;
    --line: #28303D;
    --text: #F3F5F9;
    --muted: #8D97A8;
    --accent: #FF5C35;
    --accent-dim: #B93F23;
    --ready: #35D07F;
    --warn: #FFC24D;

    --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --dock-h: auto;
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  .app {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    padding: 12px 12px 16px;
  }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: var(--accent);
    display: grid; place-items: center;
    flex: 0 0 auto;
  }
  .brand-mark svg { width: 17px; height: 17px; display: block; }
  .brand-name {
    font-size: 15px; font-weight: 800; letter-spacing: -0.02em; margin: 0;
  }

  /* Stage rail — the app has four real stages, so this encodes state,
     not decoration. */
  .rail { display: flex; align-items: center; gap: 6px; }
  .rail-step {
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .rail-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--line);
    transition: background 180ms ease, box-shadow 180ms ease;
  }
  .rail-step[data-on="true"] { color: var(--text); }
  .rail-step[data-on="true"] .rail-dot {
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 92, 53, 0.18);
  }
  .rail-label { display: none; }
  @media (min-width: 420px) { .rail-label { display: inline; } }

  /* ---------- stage ---------- */
  .stage-wrap {
    flex: 1 1 auto;
    display: grid;
    place-items: center;
    min-height: 0;
  }
  .stage {
    position: relative;
    line-height: 0;
    width: 100%;
    max-width: min(100%, calc((100dvh - 280px) * 0.5625));
    touch-action: none;
  }
  canvas#stage {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    border-radius: var(--r-lg);
    border: 1px solid var(--line);
  }

  .bubble-ring {
    position: absolute;
    border: 2px dashed rgba(255, 255, 255, 0.5);
    pointer-events: none;
    transition: opacity 160ms ease;
  }
  .bubble-ring[data-shape="circle"] { border-radius: 50%; }
  .bubble-ring[data-shape="square"] { border-radius: 12px; }
  .bubble-ring[data-hidden="true"] { opacity: 0; }

  .stage-badge {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 14px;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 13px;
    border-radius: 999px;
    background: rgba(10, 12, 17, 0.82);
    backdrop-filter: blur(6px);
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600; line-height: 1;
    letter-spacing: 0.05em;
    white-space: nowrap;
    pointer-events: none;
  }
  .stage-badge[data-rec="true"] { background: rgba(255, 92, 53, 0.94); }
  .rec-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #fff;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }

  /* empty state sits inside the stage box */
  .empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 24px;
    text-align: center; line-height: 1.5;
  }
  .empty h2 {
    margin: 0; font-size: 21px; font-weight: 800;
    letter-spacing: -0.03em; text-wrap: balance;
  }
  .empty p { margin: 0; color: var(--muted); font-size: 13px; max-width: 30ch; }

  /* ---------- controls ---------- */
  .dock { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }

  .status {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 11px 13px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    font-size: 12.5px; line-height: 1.45;
    color: #C7CEDA;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ready); margin-top: 5px; flex: 0 0 auto;
  }
  .status[data-tone="error"] { border-color: #5B2A20; background: #24140F; color: #FFB9A6; }
  .status[data-tone="error"] .status-dot { background: var(--accent); }
  .status[data-tone="busy"] .status-dot { background: var(--warn); }

  .row { display: flex; gap: 8px; }

  button {
    font-family: var(--font-display);
    cursor: pointer;
    border: 0;
    transition: transform 120ms ease, opacity 120ms ease;
  }
  button:active:not(:disabled) { transform: scale(0.985); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.42; cursor: not-allowed; }

  .btn-primary {
    flex: 1 1 auto;
    min-height: 58px;
    border-radius: 17px;
    background: var(--accent);
    color: #fff;
    font-size: 16px; font-weight: 800; letter-spacing: -0.01em;
  }
  .btn-primary[data-rec="true"] { background: #fff; color: #C33C1F; }

  .btn-secondary {
    flex: 1 1 auto;
    min-height: 48px;
    border-radius: var(--r-md);
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--line);
    font-size: 14px; font-weight: 600;
  }

  .btn-ghost {
    min-height: 40px; padding: 0 14px;
    border-radius: var(--r-sm);
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    font-size: 13px; font-weight: 600;
  }

  /* size + shape strip */
  .strip {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    padding: 8px 8px 8px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
  }
  .strip-label {
    font-family: var(--font-mono);
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--muted);
  }
  .seg { display: flex; gap: 4px; background: var(--ground); padding: 3px; border-radius: var(--r-sm); }
  .seg button {
    min-height: 34px; padding: 0 13px;
    border-radius: 7px;
    background: transparent; color: var(--muted);
    font-size: 12.5px; font-weight: 600;
  }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }

  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 38px; height: 38px;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 19px; font-weight: 600; line-height: 1;
  }
  .stepper output {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--muted);
    min-width: 46px; text-align: center;
  }

  /* capacity meter — real constraint (16 MiB save limit), so it earns its place */
  .meter { display: flex; align-items: center; gap: 9px; }
  .meter-track {
    flex: 1 1 auto; height: 4px; border-radius: 2px;
    background: var(--line); overflow: hidden;
  }
  .meter-fill {
    height: 100%; width: 0%;
    background: var(--ready);
    transition: width 300ms linear, background 300ms ease;
  }
  .meter-fill[data-near="true"] { background: var(--warn); }
  .meter-text {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 10.5px; color: var(--muted); white-space: nowrap;
  }

  .hint {
    font-size: 11.5px; color: var(--muted); line-height: 1.5;
    text-align: center; margin: 0; text-wrap: balance;
  }

  .offscreen {
    position: absolute; width: 1px; height: 1px;
    opacity: 0; pointer-events: none; left: -9999px; top: 0;
  }

  .hidden { display: none !important; }

  video.review {
    display: block; width: 100%; height: auto;
    border-radius: var(--r-lg); background: #000;
    border: 1px solid var(--line);
  }
</style>

<div class="app">
  <header class="masthead">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/></svg>
      </span>
      <h1 class="brand-name">Reel Reactor</h1>
    </div>
    <nav class="rail" id="rail" aria-label="Progress">
      <span class="rail-step" data-step="pick"><span class="rail-dot"></span><span class="rail-label">Clip</span></span>
      <span class="rail-step" data-step="frame"><span class="rail-dot"></span><span class="rail-label">Frame</span></span>
      <span class="rail-step" data-step="record"><span class="rail-dot"></span><span class="rail-label">Record</span></span>
      <span class="rail-step" data-step="save"><span class="rail-dot"></span><span class="rail-label">Save</span></span>
    </nav>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stageBox">
      <canvas id="stage" width="720" height="1280"></canvas>
      <div class="bubble-ring" id="ring" data-shape="circle" data-hidden="true"></div>
      <div class="stage-badge" id="badge" data-rec="false"><span id="badgeText">Drag to move · pinch to resize</span></div>

      <div class="empty" id="empty">
        <h2>React while the video rolls</h2>
        <p>Pick a clip from your phone. Your camera goes on top. One file comes out.</p>
      </div>
    </div>

    <video class="review hidden" id="reviewVideo" controls playsinline></video>
  </div>

  <div class="dock" id="dock">
    <div class="status" id="status" data-tone="idle">
      <span class="status-dot"></span>
      <span id="statusText">Pick a clip to get started. Nothing leaves your phone.</span>
    </div>

    <div class="meter hidden" id="meter">
      <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
      <span class="meter-text" id="meterText">0.0 / 15 MB</span>
    </div>

    <div class="strip hidden" id="strip">
      <span class="strip-label">Bubble</span>
      <div class="seg" role="group" aria-label="Bubble shape">
        <button type="button" id="shapeCircle" aria-pressed="true">Circle</button>
        <button type="button" id="shapeSquare" aria-pressed="false">Square</button>
      </div>
      <div class="stepper">
        <button type="button" id="sizeDown" aria-label="Smaller bubble">&minus;</button>
        <output id="sizeOut">220</output>
        <button type="button" id="sizeUp" aria-label="Bigger bubble">+</button>
      </div>
    </div>

    <div class="row" id="setupRow">
      <button type="button" class="btn-primary" id="pickBtn">Choose a clip</button>
    </div>

    <div class="row hidden" id="camRow">
      <button type="button" class="btn-secondary" id="camBtn">Turn on camera + mic</button>
      <button type="button" class="btn-ghost" id="changeBtn">Change clip</button>
    </div>

    <div class="row hidden" id="recRow">
      <button type="button" class="btn-primary" id="recBtn" data-rec="false" disabled>Start recording</button>
    </div>

    <div class="row hidden" id="reviewRow">
      <button type="button" class="btn-primary" id="saveBtn">Save video</button>
      <button type="button" class="btn-secondary" id="againBtn">Record again</button>
    </div>

    <p class="hint" id="hint">Videos stay on your phone. Nothing is uploaded.</p>
  </div>
</div>

<input type="file" accept="video/*" id="fileInput" class="offscreen">
<video id="srcVideo" playsinline preload="auto" class="offscreen"></video>
<video id="camVideo" playsinline muted class="offscreen"></video>

<script>
(function () {
  "use strict";

  var W = 720, H = 1280;
  var MIN_SIZE = 110, MAX_SIZE = 460;
  var SIZE_CAP_BYTES = 15 * 1024 * 1024; // stay under the 16 MiB save ceiling

  var $ = function (id) { return document.getElementById(id); };

  var canvas = $("stage"), ctx = canvas.getContext("2d");
  var srcVideo = $("srcVideo"), camVideo = $("camVideo");
  var ring = $("ring"), badge = $("badge"), badgeText = $("badgeText");
  var stageBox = $("stageBox"), empty = $("empty");
  var reviewVideo = $("reviewVideo");
  var statusEl = $("status"), statusText = $("statusText");
  var meter = $("meter"), meterFill = $("meterFill"), meterText = $("meterText");
  var strip = $("strip"), hint = $("hint");
  var setupRow = $("setupRow"), camRow = $("camRow"), recRow = $("recRow"), reviewRow = $("reviewRow");
  var pickBtn = $("pickBtn"), camBtn = $("camBtn"), changeBtn = $("changeBtn");
  var recBtn = $("recBtn"), saveBtn = $("saveBtn"), againBtn = $("againBtn");
  var fileInput = $("fileInput");
  var sizeOut = $("sizeOut");

  var overlay = { x: 440, y: 150, size: 220 };
  var shape = "circle";
  var stage = "pick";
  var camReady = false, srcReady = false, recording = false, busy = false;
  var camStream = null, recorder = null, chunks = [], bytes = 0;
  var audioCtx = null, audioDest = null, srcNode = null, micNode = null;
  var startedAt = 0, timerId = 0, rafId = 0;
  var outputBlob = null, outputUrl = null;
  var downloads = null;

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (d) { downloads = d; }).catch(function () {});
  }

  /* ---------- drawing ---------- */

  function clampOverlay() {
    overlay.size = Math.max(MIN_SIZE, Math.min(MAX_SIZE, Math.round(overlay.size)));
    overlay.x = Math.max(0, Math.min(W - overlay.size, overlay.x));
    overlay.y = Math.max(0, Math.min(H - overlay.size, overlay.y));
  }

  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    if (srcVideo.videoWidth && srcVideo.videoHeight) {
      var s = Math.min(W / srcVideo.videoWidth, H / srcVideo.videoHeight);
      var dw = srcVideo.videoWidth * s, dh = srcVideo.videoHeight * s;
      ctx.drawImage(srcVideo, (W - dw) / 2, (H - dh) / 2, dw, dh);
    }

    if (camVideo.readyState >= 2 && camVideo.videoWidth) {
      var cw = camVideo.videoWidth, chh = camVideo.videoHeight;
      var side = Math.min(cw, chh);
      var cx = (cw - side) / 2, cy = (chh - side) / 2;
      var r = overlay.size / 2;

      ctx.save();
      if (shape === "circle") {
        ctx.beginPath();
        ctx.arc(overlay.x + r, overlay.y + r, r, 0, Math.PI * 2);
      } else {
        roundRectPath(ctx, overlay.x, overlay.y, overlay.size, overlay.size, overlay.size * 0.14);
      }
      ctx.clip();
      ctx.translate(overlay.x + overlay.size, overlay.y);
      ctx.scale(-1, 1);
      ctx.drawImage(camVideo, cx, cy, side, side, 0, 0, overlay.size, overlay.size);
      ctx.restore();

      ctx.lineWidth = 7;
      ctx.strokeStyle = "#FFFFFF";
      if (shape === "circle") {
        ctx.beginPath();
        ctx.arc(overlay.x + r, overlay.y + r, r - 3.5, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        roundRectPath(ctx, overlay.x + 3.5, overlay.y + 3.5, overlay.size - 7, overlay.size - 7, overlay.size * 0.13);
        ctx.stroke();
      }
    }

    rafId = requestAnimationFrame(draw);
  }

  function syncRing() {
    ring.style.left = (overlay.x / W * 100) + "%";
    ring.style.top = (overlay.y / H * 100) + "%";
    ring.style.width = (overlay.size / W * 100) + "%";
    ring.style.height = (overlay.size / H * 100) + "%";
    ring.setAttribute("data-shape", shape);
    ring.setAttribute("data-hidden", (!camReady || recording) ? "true" : "false");
    sizeOut.textContent = String(overlay.size);
  }

  /* ---------- ui state ---------- */

  function setStatus(text, tone) {
    statusText.textContent = text;
    statusEl.setAttribute("data-tone", tone || "idle");
  }

  function setStage(next) {
    stage = next;
    var order = ["pick", "frame", "record", "save"];
    var idx = order.indexOf(next);
    var steps = document.querySelectorAll(".rail-step");
    for (var i = 0; i < steps.length; i++) {
      steps[i].setAttribute("data-on", i <= idx ? "true" : "false");
    }
  }

  function show(el, on) { el.classList.toggle("hidden", !on); }

  function render() {
    show(empty, stage === "pick");
    show(setupRow, stage === "pick");
    show(camRow, stage === "frame" && !camReady);
    show(recRow, stage === "frame" && camReady);
    show(reviewRow, stage === "save");
    show(strip, stage === "frame" && camReady && !recording);
    show(meter, recording);
    show(stageBox, stage !== "save");
    show(reviewVideo, stage === "save");
    badge.classList.toggle("hidden", stage !== "frame" && stage !== "record");
    syncRing();
  }

  function fmtClock(sec) {
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  /* ---------- source clip ---------- */

  pickBtn.addEventListener("click", function () { fileInput.click(); });
  changeBtn.addEventListener("click", function () { fileInput.click(); });

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    srcReady = false;
    if (srcVideo.src) URL.revokeObjectURL(srcVideo.src);
    srcVideo.src = URL.createObjectURL(file);
    srcVideo.load();
    setStatus("Loading “" + file.name + "”…", "busy");
    setStage("frame");
    render();
  });

  function primeFirstFrame() {
    // Android Chrome will not decode a paused, offscreen video, so the canvas
    // paints black. A brief muted play forces one frame out.
    var wasMuted = srcVideo.muted;
    srcVideo.muted = true;
    var p = srcVideo.play();
    if (p && p.then) {
      p.then(function () {
        window.setTimeout(function () {
          srcVideo.pause();
          srcVideo.currentTime = 0;
          srcVideo.muted = wasMuted;
        }, 140);
      }).catch(function () {
        srcVideo.muted = wasMuted;
        try { srcVideo.currentTime = 0.05; } catch (e) {}
      });
    }
  }

  function onSrcReady() {
    if (srcReady) return;
    srcReady = true;
    primeFirstFrame();
    recBtn.disabled = !camReady;
    if (camReady) {
      setStatus("Ready. Drag anywhere on the video to move your bubble, pinch to resize.", "idle");
    } else {
      setStatus("Clip loaded. Now turn on your camera and mic.", "idle");
    }
  }

  srcVideo.addEventListener("loadeddata", onSrcReady);
  srcVideo.addEventListener("canplay", onSrcReady);

  srcVideo.addEventListener("error", function () {
    srcReady = false;
    recBtn.disabled = true;
    setStatus("Your browser can’t play that file. Try an MP4 recorded on this phone, or pick a different clip.", "error");
  });

  srcVideo.addEventListener("ended", function () {
    if (recording) stopRecording();
  });

  /* ---------- camera ---------- */

  var isFramed = false;
  try { isFramed = window.self !== window.top; } catch (e) { isFramed = true; }

  camBtn.addEventListener("click", function () {
    if (busy) return;
    if (isFramed) {
      setStatus("Your camera can\u2019t be reached inside this preview window \u2014 the browser blocks it for embedded pages. Open the page on its own tab and it works. See the notes I sent you.", "error");
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("This browser can’t reach the camera. Open this page in Chrome.", "error");
      return;
    }
    busy = true;
    camBtn.disabled = true;
    setStatus("Asking for camera and microphone…", "busy");

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 720 } },
      audio: { echoCancellation: true, noiseSuppression: true }
    }).then(function (stream) {
      camStream = stream;
      camVideo.srcObject = stream;
      return camVideo.play();
    }).then(function () {
      camReady = true;
      busy = false;
      camBtn.disabled = false;
      recBtn.disabled = !srcReady;
      setStatus(srcReady
        ? "Ready. Drag anywhere on the video to move your bubble, pinch to resize."
        : "Camera on. Waiting for the clip to finish loading.", "idle");
      render();
    }).catch(function (err) {
      busy = false;
      camBtn.disabled = false;
      setStatus("Camera or mic was blocked: " + (err && err.message ? err.message : "permission denied") +
        ". Check the padlock in the address bar and allow both.", "error");
    });
  });

  /* ---------- gestures: one finger moves, two fingers resize ---------- */

  var pointers = {};
  var lastPos = null, pinchStart = 0, pinchSize = 0;

  function pointerList() {
    var out = [];
    for (var k in pointers) if (Object.prototype.hasOwnProperty.call(pointers, k)) out.push(pointers[k]);
    return out;
  }

  function canvasScale() {
    var box = canvas.getBoundingClientRect();
    return box.width ? (W / box.width) : 1;
  }

  stageBox.addEventListener("pointerdown", function (e) {
    if (recording || !camReady) return;
    stageBox.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var list = pointerList();
    if (list.length === 1) {
      lastPos = { x: e.clientX, y: e.clientY };
    } else if (list.length === 2) {
      pinchStart = Math.hypot(list[0].x - list[1].x, list[0].y - list[1].y);
      pinchSize = overlay.size;
      lastPos = null;
    }
  });

  stageBox.addEventListener("pointermove", function (e) {
    if (!pointers[e.pointerId]) return;
    e.preventDefault();
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var list = pointerList();
    var k = canvasScale();

    if (list.length >= 2) {
      var dist = Math.hypot(list[0].x - list[1].x, list[0].y - list[1].y);
      if (pinchStart > 0) {
        overlay.size = pinchSize * (dist / pinchStart);
        clampOverlay();
        syncRing();
      }
      return;
    }

    if (lastPos) {
      overlay.x += (e.clientX - lastPos.x) * k;
      overlay.y += (e.clientY - lastPos.y) * k;
      lastPos = { x: e.clientX, y: e.clientY };
      clampOverlay();
      syncRing();
    }
  });

  function endPointer(e) {
    delete pointers[e.pointerId];
    var list = pointerList();
    if (list.length === 1) { lastPos = { x: list[0].x, y: list[0].y }; pinchStart = 0; }
    else if (list.length === 0) { lastPos = null; pinchStart = 0; }
  }
  stageBox.addEventListener("pointerup", endPointer);
  stageBox.addEventListener("pointercancel", endPointer);

  // Desktop convenience
  stageBox.addEventListener("wheel", function (e) {
    if (recording || !camReady) return;
    e.preventDefault();
    overlay.size -= e.deltaY * 0.5;
    clampOverlay();
    syncRing();
  }, { passive: false });

  $("sizeDown").addEventListener("click", function () { overlay.size -= 28; clampOverlay(); syncRing(); });
  $("sizeUp").addEventListener("click", function () { overlay.size += 28; clampOverlay(); syncRing(); });

  $("shapeCircle").addEventListener("click", function () { setShape("circle"); });
  $("shapeSquare").addEventListener("click", function () { setShape("square"); });

  function setShape(next) {
    shape = next;
    $("shapeCircle").setAttribute("aria-pressed", String(next === "circle"));
    $("shapeSquare").setAttribute("aria-pressed", String(next === "square"));
    syncRing();
  }

  /* ---------- recording ---------- */

  function pickMime() {
    var list = [
      "video/mp4;codecs=h264,aac",
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ];
    for (var i = 0; i < list.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(list[i])) return list[i];
    }
    return "";
  }

  function buildAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("this browser can’t mix the two audio tracks");
    if (!audioCtx) audioCtx = new AC();
    if (!audioDest) audioDest = audioCtx.createMediaStreamDestination();
    if (!srcNode) {
      srcNode = audioCtx.createMediaElementSource(srcVideo);
      srcNode.connect(audioDest);
      srcNode.connect(audioCtx.destination);
    }
    if (!micNode && camStream) {
      micNode = audioCtx.createMediaStreamSource(camStream);
      micNode.connect(audioDest);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioDest;
  }

  recBtn.addEventListener("click", function () {
    if (recording) { stopRecording(); return; }
    startRecording();
  });

  function startRecording() {
    if (!camReady || !srcReady || busy) return;
    if (!window.MediaRecorder || !canvas.captureStream) {
      setStatus("This browser can’t record video. Open this page in Chrome.", "error");
      return;
    }
    busy = true;
    setStatus("Starting…", "busy");

    var dest;
    try { dest = buildAudio(); }
    catch (err) { busy = false; setStatus("Couldn’t start: " + err.message, "error"); return; }

    srcVideo.currentTime = 0;
    srcVideo.play().then(function () {
      var visual = canvas.captureStream(30);
      var tracks = visual.getVideoTracks().concat(dest.stream.getAudioTracks());
      var mime = pickMime();
      var opts = { videoBitsPerSecond: 2500000 };
      if (mime) opts.mimeType = mime;

      recorder = new MediaRecorder(new MediaStream(tracks), opts);
      chunks = [];
      bytes = 0;

      recorder.ondataavailable = function (e) {
        if (!e.data || !e.data.size) return;
        chunks.push(e.data);
        bytes += e.data.size;
        updateMeter();
        if (bytes >= SIZE_CAP_BYTES) {
          setStatus("Hit the size limit — wrapping up your video now.", "busy");
          stopRecording();
        }
      };

      recorder.onerror = function () {
        setStatus("Recording failed part way through. Nothing was saved — try again.", "error");
        finishFailed();
      };

      recorder.onstop = function () { finishRecording(); };

      recorder.start(1000);
      startedAt = Date.now();
      recording = true;
      busy = false;
      recBtn.setAttribute("data-rec", "true");
      recBtn.textContent = "Stop recording · 0:00";
      badge.setAttribute("data-rec", "true");
      badgeText.innerHTML = "";
      var dot = document.createElement("span");
      dot.className = "rec-dot";
      badge.insertBefore(dot, badgeText);
      badgeText.textContent = "REC 0:00";
      setStage("record");
      setStatus("Recording. It stops on its own when the clip ends.", "busy");
      hint.textContent = "Talk over it. Recording ends automatically at the end of the clip.";
      updateMeter();
      render();

      timerId = window.setInterval(function () {
        var t = fmtClock((Date.now() - startedAt) / 1000);
        recBtn.textContent = "Stop recording · " + t;
        badgeText.textContent = "REC " + t;
      }, 250);
    }).catch(function (err) {
      busy = false;
      setStatus("Couldn’t play the clip: " + (err && err.message ? err.message : "unknown error"), "error");
    });
  }

  function updateMeter() {
    var pct = Math.min(100, bytes / SIZE_CAP_BYTES * 100);
    meterFill.style.width = pct + "%";
    meterFill.setAttribute("data-near", pct > 75 ? "true" : "false");
    meterText.textContent = (bytes / 1048576).toFixed(1) + " / 15 MB";
  }

  function stopRecording() {
    if (!recorder || recorder.state === "inactive") return;
    setStatus("Finishing your video…", "busy");
    recorder.stop();
  }

  function cleanupRecording() {
    window.clearInterval(timerId);
    recording = false;
    srcVideo.pause();
    var dot = badge.querySelector(".rec-dot");
    if (dot) dot.remove();
    badge.setAttribute("data-rec", "false");
    badgeText.textContent = "Drag to move · pinch to resize";
    recBtn.setAttribute("data-rec", "false");
    recBtn.textContent = "Start recording";
  }

  function finishFailed() {
    cleanupRecording();
    setStage("frame");
    hint.textContent = "Videos stay on your phone. Nothing is uploaded.";
    render();
  }

  function finishRecording() {
    cleanupRecording();

    if (bytes < 2048) {
      setStatus("That recording came out empty. Try again once the clip is playing.", "error");
      setStage("frame");
      render();
      return;
    }

    outputBlob = new Blob(chunks, { type: (recorder && recorder.mimeType) || "video/webm" });
    if (outputUrl) URL.revokeObjectURL(outputUrl);
    outputUrl = URL.createObjectURL(outputBlob);
    reviewVideo.src = outputUrl;

    setStage("save");
    setStatus("Done — one video with the clip, your face and both sound tracks.", "idle");
    hint.textContent = "Save it to your phone, then post it from your gallery.";
    saveBtn.disabled = false;
    saveBtn.textContent = "Save video";
    render();
  }

  againBtn.addEventListener("click", function () {
    setStage("frame");
    setStatus("Ready to go again. Reframe your bubble, then start recording.", "idle");
    hint.textContent = "Videos stay on your phone. Nothing is uploaded.";
    render();
  });

  /* ---------- saving ---------- */

  function extFor(blob) {
    return (blob.type && blob.type.indexOf("mp4") !== -1) ? "mp4" : "webm";
  }

  saveBtn.addEventListener("click", function () {
    if (!outputBlob) return;
    var name = "reel-reactor-" + Date.now() + "." + extFor(outputBlob);

    // Best case on a phone: the system share sheet, straight into your gallery
    // or an app. Falls through to the viewer's save prompt when unavailable.
    var file = null;
    try { file = new File([outputBlob], name, { type: outputBlob.type }); } catch (e) {}

    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      saveBtn.disabled = true;
      saveBtn.textContent = "Opening share sheet…";
      navigator.share({ files: [file] }).then(function () {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save video";
        setStatus("Sent to the share sheet.", "idle");
      }).catch(function () {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save video";
        fallbackSave(name);
      });
      return;
    }
    fallbackSave(name);
  });

  function fallbackSave(name) {
    if (!downloads) {
      setStatus("Saving isn’t available in this view. Long-press the video above and choose Download instead.", "error");
      return;
    }
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";
    downloads.save({ filename: name, data: outputBlob }).then(function () {
      saveBtn.disabled = false;
      saveBtn.textContent = "Saved — save again";
      setStatus("Saved to your device.", "idle");
    }).catch(function (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save video";
      var code = err && err.code;
      if (code === "declined") setStatus("Save cancelled. Tap Save video when you’re ready.", "idle");
      else if (code === "too_large") setStatus("That file is over the 16 MB save limit. Record a shorter take.", "error");
      else setStatus("Couldn’t save: " + ((err && err.message) || "unknown error") + ". Long-press the video and choose Download instead.", "error");
    });
  }

  /* ---------- go ---------- */

  setShape("circle");
  clampOverlay();
  setStage("pick");
  render();
  draw();

  if (isFramed) {
    setStatus("Heads up: this is running inside a preview window, and browsers block camera access there. You can load a clip and try the controls, but recording needs the page opened in its own tab.", "error");
    hint.textContent = "Preview mode \u2014 camera disabled by the browser, not by the app.";
  }

  window.addEventListener("pagehide", function () {
    if (rafId) cancelAnimationFrame(rafId);
    if (camStream) camStream.getTracks().forEach(function (t) { t.stop(); });
  });
})();
</script>
</body>
</html>
