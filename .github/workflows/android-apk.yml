name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      REEL_REACTOR_SIDE_BY_SIDE: "1"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and CMake
        uses: android-actions/setup-android@v3

      - name: Install Android CMake
        run: sdkmanager "cmake;3.22.1"

      - - name: Install JavaScript dependencies
        run: pnpm install

      - name: Restore ffmpeg-expo plugin files
        run: |
          git fetch --depth=1 origin 211ba865950936557b066dc431e7875d89a7ad15
          git checkout 211ba865950936557b066dc431e7875d89a7ad15 -- vendor/ffmpeg-expo/plugin vendor/ffmpeg-expo/build

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Upload standalone Android APK
        uses: actions/upload-artifact@v4
        with:
          name: reel-reactor-test-v1.0.24-code-25-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
